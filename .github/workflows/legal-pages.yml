name: Publish Resume.AI legal site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legal-pages.yml
      - static/privacy.html
      - static/terms.html
      - static/support.html
      - static/styles.css
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: resume-ai-legal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public legal and support assets
        run: |
          mkdir -p .legal-pages
          cp static/privacy.html static/terms.html static/support.html static/styles.css .legal-pages/
          cp static/support.html .legal-pages/index.html
          touch .legal-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .legal-pages
      - name: Deploy legal site
        id: deployment
        uses: actions/deploy-pages@v4
