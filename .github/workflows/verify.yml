name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  redis-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Install frozen Python environment
        run: uv sync --frozen

      - name: Verify atomic allowance behavior with Redis
        run: uv run pytest tests/test_entitlements_redis.py -q

  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install frozen Python environment
        run: uv sync --frozen

      - name: Test Python service
        run: uv run pytest -q

      - name: Test browser client
        run: node --test tests/*.test.cjs

      - name: Scan tracked files
        run: node scripts/scan-secrets.mjs

      - name: Verify no sensitive retention
        run: uv run python scripts/verify_no_sensitive_retention.py

      - name: Install frozen mobile environment
        working-directory: mobile
        run: npm ci

      - name: Test mobile app
        working-directory: mobile
        run: npm test -- --runInBand

      - name: Type-check mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Lint mobile app
        working-directory: mobile
        run: npm run lint

      - name: Check Expo dependencies
        working-directory: mobile
        run: npx --yes expo-doctor@latest

      - name: Export iOS bundle
        working-directory: mobile
        run: npx expo export --platform ios

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Verify native generation is manifest-stable
        working-directory: mobile
        run: git diff --exit-code -- package.json package-lock.json

      - name: Audit mobile dependencies
        run: node scripts/check-mobile-audit.mjs

      - name: Check committed patch whitespace
        run: >-
          python scripts/check_committed_whitespace.py
          --event-name "${{ github.event_name }}"
          --head "${{ github.sha }}"
          --before "${{ github.event.before }}"
          --base "${{ github.event.pull_request.base.sha }}"
