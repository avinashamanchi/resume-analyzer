[project]
name = "resume-ai-service"
version = "0.1.0"
description = "Privacy-conscious Resume.AI backend service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=5,<7",
    "groq>=0.9,<1",
    "gunicorn>=23,<24",
    "httpx>=0.27,<1",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.10,<3",
    "redis>=5,<7",
]

[dependency-groups]
dev = [
    "fakeredis>=2.25,<3",
    "jsonschema>=4.25,<5",
    "pyyaml>=6.0,<7",
    "pytest>=8.3,<9",
    "rfc3339-validator>=0.1.4,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
